<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Viewer</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        #twitch-embed { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <!-- The element where the Twitch player will appear -->
    <div id="twitch-embed"></div>

    <!-- Load the official Twitch embed script -->
    <script src="https://twitch.tv"></script>

    <!-- Initialize the stream layout -->
    <script type="text/javascript">
      new Twitch.Embed("twitch-embed", {
        width: "100%",
        height: "100%",
        channel: "joebartolozzi",
        parent: ["jjenkins2030-gif.github.io"],
        layout: "video"
      });
    </script>

</body>
</html>
